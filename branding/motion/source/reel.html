<!doctype html>
<meta charset="utf-8">
<title>Clipnera motion reel · round 1 render harness</title>
<!-- Round-1 pieces are CSS animations. render.mjs mounts one at a time on a
     360x640 stage, seeks every animation to a time and screenshots it. -->
<link rel="stylesheet" href="fonts.css">
<style>
:root{--amber:#f59e0b;--ink:#0a0a0a;--k:1}
html,body{margin:0;background:#000}
/* ---------- stage (the fake video frame) ---------- */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:12px;background:#000;container-type:inline-size;font-size:calc(var(--k) * 4.2cqw)}
body.land{--k:.5625}
body.land .stage{aspect-ratio:16/9}
.footage{position:absolute;inset:-10%;
  background:
    radial-gradient(40% 30% at 30% 28%, hsl(var(--h) 70% 55% / .55), transparent 70%),
    radial-gradient(50% 40% at 75% 62%, hsl(calc(var(--h) + 40) 60% 45% / .6), transparent 70%),
    linear-gradient(160deg, hsl(var(--h) 30% 17%), hsl(calc(var(--h) + 30) 35% 7%));
  animation:drift 14s ease-in-out infinite alternate}
.subj{position:absolute;left:50%;bottom:10%;width:62%;aspect-ratio:1/1.05;transform-origin:50% 100%;
  background:
    radial-gradient(circle at 50% 30%, hsl(var(--h) 18% 11%) 0 18%, transparent 18.6%),
    radial-gradient(ellipse 50% 44% at 50% 100%, hsl(var(--h) 18% 11%) 0 99%, transparent 100%);
  animation:sway 5s ease-in-out infinite alternate}
body.land .subj{width:32%}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
@keyframes sway{from{transform:translateX(-52%) rotate(-1.5deg)}to{transform:translateX(-48%) rotate(1.5deg)}}
.cap{position:absolute;left:8%;right:8%;bottom:30%;text-align:center;font:800 1.15em/1.15 Syne,system-ui,sans-serif;text-transform:uppercase;color:#fff;text-shadow:0 .08em .3em rgba(0,0,0,.7)}
.cap em{font-style:normal;color:var(--amber)}
body.land .cap{bottom:10%}

/* ---------- the mark ---------- */
.mark{display:inline-flex;align-items:center;gap:.32em;font-family:Syne,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1;color:#fff;white-space:nowrap}
.tile{width:1.3em;height:1.3em;flex:none;display:block;overflow:visible}
.tile .star,.tile .x1,.tile .x2{transform-box:fill-box;transform-origin:center}
.w{display:inline-flex}
.c{color:#fff}.n{color:var(--amber)}
.l{display:inline-block}
.wm{position:absolute;top:5.5%;right:5.5%;filter:drop-shadow(0 .06em .25em rgba(0,0,0,.45))}
.pill{background:rgba(24,22,20,.62);padding:.32em .62em .32em .34em;border-radius:99em;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden}

/* W1 Sparkle Twinkle */
.m-twinkle .tile{animation:glow 4s ease-out infinite}
.m-twinkle .star{animation:twStar 4s cubic-bezier(.3,1.4,.5,1) infinite}
.m-twinkle .x1{animation:blink 4s infinite}
.m-twinkle .x2{animation:blink 4s .25s infinite backwards}
@keyframes twStar{0%{transform:scale(1) rotate(0)}8%{transform:scale(1.3) rotate(45deg)}18%,100%{transform:scale(1) rotate(90deg)}}
@keyframes blink{0%,14%{opacity:1}20%{opacity:0}28%,100%{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}8%{filter:drop-shadow(0 0 .35em rgba(245,158,11,.85))}30%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}}

/* W2 Sheen Sweep */
.m-sheen::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-150%) skewX(-18deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-150%) skewX(-18deg)}80%,100%{transform:translateX(350%) skewX(-18deg)}}

/* W3 Letter Rise */
.m-rise .tile{animation:pop 6s cubic-bezier(.3,1.6,.5,1) infinite}
.m-rise .l{animation:rise 6s cubic-bezier(.2,1.4,.4,1) infinite backwards;animation-delay:calc(var(--i) * 60ms + 200ms)}
@keyframes pop{0%{transform:scale(0) rotate(-120deg);opacity:0}8%,86%{transform:none;opacity:1}94%,100%{transform:scale(0);opacity:0}}
@keyframes rise{0%,6%{opacity:0;transform:translateY(.6em)}14%,82%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(-.4em)}}

/* W4 Corner Hop */
.m-hop{right:auto;animation:hop 12s ease infinite}
@keyframes hop{
  0%{opacity:0;left:5.5%;top:5.5%;transform:none}
  3%,22%{opacity:1;left:5.5%;top:5.5%;transform:none}
  25%{opacity:0;left:5.5%;top:5.5%;transform:none}
  25.01%{opacity:0;left:94.5%;top:5.5%;transform:translate(-100%,0)}
  28%,47%{opacity:1;left:94.5%;top:5.5%;transform:translate(-100%,0)}
  50%{opacity:0;left:94.5%;top:5.5%;transform:translate(-100%,0)}
  50.01%{opacity:0;left:94.5%;top:94.5%;transform:translate(-100%,-100%)}
  53%,72%{opacity:1;left:94.5%;top:94.5%;transform:translate(-100%,-100%)}
  75%{opacity:0;left:94.5%;top:94.5%;transform:translate(-100%,-100%)}
  75.01%{opacity:0;left:5.5%;top:94.5%;transform:translate(0,-100%)}
  78%,97%{opacity:1;left:5.5%;top:94.5%;transform:translate(0,-100%)}
  100%{opacity:0;left:5.5%;top:94.5%;transform:translate(0,-100%)}}

/* W5 Unfold */
.m-unfold .tile{animation:spin 7s cubic-bezier(.7,0,.2,1) infinite}
.m-unfold .w{overflow:hidden;max-width:0;opacity:0;animation:unfold 7s cubic-bezier(.7,0,.2,1) infinite}
@keyframes spin{0%,10%{transform:rotate(0)}22%,78%{transform:rotate(360deg)}90%,100%{transform:rotate(720deg)}}
@keyframes unfold{0%,10%{max-width:0;opacity:0}22%,78%{max-width:6em;opacity:1}90%,100%{max-width:0;opacity:0}}

/* W6 Clip Cut */
.m-cut .c,.m-cut .n{display:inline-block}
.m-cut .c{animation:cutL 5s cubic-bezier(.3,1.3,.5,1) infinite}
.m-cut .n{animation:cutR 5s cubic-bezier(.3,1.3,.5,1) infinite}
.cutline{position:relative;width:0;align-self:stretch}
.cutline::before{content:"";position:absolute;left:-.04em;top:-.22em;bottom:-.22em;width:.08em;border-radius:1em;background:#fff;transform:scaleY(0);animation:cutln 5s ease-out infinite}
@keyframes cutln{0%,8%{transform:scaleY(0);opacity:1}14%{transform:scaleY(1);opacity:1}24%,100%{transform:scaleY(1);opacity:0}}
@keyframes cutL{0%,14%{transform:none}24%,56%{transform:translate(-.14em,-.05em) rotate(-5deg)}68%,100%{transform:none}}
@keyframes cutR{0%,14%{transform:none}24%,56%{transform:translate(.14em,.05em) rotate(5deg)}68%,100%{transform:none}}

/* W7 Playhead */
.m-play{flex-direction:column;align-items:stretch;gap:.28em}
.m-play .row{display:flex;align-items:center;gap:.32em}
.bar{position:relative;height:.1em;border-radius:1em;background:rgba(255,255,255,.28)}
.bar::before{content:"";position:absolute;inset:0;border-radius:1em;background:var(--amber);transform-origin:left;transform:scaleX(0);animation:fill 10s linear infinite}
.bar::after{content:"";position:absolute;top:50%;left:0;width:.3em;height:.3em;border-radius:50%;background:var(--amber);box-shadow:0 0 .3em var(--amber);transform:translate(-50%,-50%);animation:head 10s linear infinite}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes head{to{left:100%}}

/* W8 Breathe */
.m-breathe{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:none}50%{opacity:.85;transform:translateY(-.08em)}}

/* ---------- full-screen pieces ---------- */
.fs{position:absolute;inset:0;display:grid;place-items:center;background:#0b0a09;overflow:hidden}
.center{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:.8em}
.lock{font-size:2.4em}
.tag{font:600 1em/1.2 "Plus Jakarta Sans",system-ui,sans-serif;color:#b8ada0;letter-spacing:.01em;text-align:center}
.tw{position:relative;display:block}

/* F1 Sparkle Ignite */
.f1 .tile{animation:f1tile 5.5s cubic-bezier(.3,1.4,.5,1) infinite}
.f1 .star{stroke-dasharray:1;stroke-dashoffset:1;animation:f1draw 5.5s ease-in-out infinite}
.f1 .x1,.f1 .x2{animation:f1x 5.5s infinite}
.ray{position:absolute;left:50%;top:50%;width:.07em;height:.32em;border-radius:1em;background:var(--amber);opacity:0;animation:f1ray 5.5s ease-out infinite}
.f1 .w{animation:f1word 5.5s cubic-bezier(.2,.8,.2,1) infinite}
.f1 .tag{animation:f1tag 5.5s ease infinite}
@keyframes f1tile{0%{transform:scale(0) rotate(-90deg);opacity:0}14%,90%{transform:none;opacity:1}100%{transform:scale(.92);opacity:0}}
@keyframes f1draw{0%,12%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes f1x{0%,28%{opacity:0}32%,90%{opacity:1}100%{opacity:0}}
@keyframes f1ray{0%,30%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-.75em) scaleY(.2)}34%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-1em) scaleY(1)}44%,100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-1.5em) scaleY(.3)}}
@keyframes f1word{0%,30%{clip-path:inset(0 100% 0 0);transform:translateX(-.5em);opacity:1}46%,90%{clip-path:inset(0 0 0 0);transform:none;opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
@keyframes f1tag{0%,48%{opacity:0;transform:translateY(.4em)}58%,88%{opacity:1;transform:none}96%,100%{opacity:0}}

/* F2 Timeline Cut */
.strip{position:absolute;left:50%;top:50%;display:flex;gap:.45em;z-index:1;animation:f2strip 6s cubic-bezier(.5,0,.3,1) infinite}
.fr{flex:none;width:3.6em;height:2.4em;border-radius:.3em;background:linear-gradient(135deg,hsl(var(--h) 60% 45%),hsl(calc(var(--h) + 50) 55% 22%));animation:f2fr 6s ease-in infinite backwards;animation-delay:calc(var(--i) * 25ms)}
.ph{position:absolute;left:50%;top:50%;z-index:2;width:.12em;height:4.2em;border-radius:1em;background:var(--amber);box-shadow:0 0 .6em rgba(245,158,11,.7);animation:f2ph 6s cubic-bezier(.7,0,.3,1) infinite}
.f2 .lock{gap:0}
.f2 .tile{animation:f2tile 6s cubic-bezier(.3,1.5,.5,1) infinite}
.f2 .w{overflow:hidden;max-width:0;animation:f2word 6s cubic-bezier(.7,0,.2,1) infinite}
@keyframes f2strip{0%{transform:translate(-15%,-50%);opacity:0}6%{opacity:1}40%,100%{transform:translate(-70%,-50%);opacity:1}}
@keyframes f2fr{0%,36%{transform:none;opacity:1}46%,100%{transform:scale(0);opacity:0}}
@keyframes f2ph{0%,4%{opacity:1;transform:translate(-50%,-50%) scaleY(0)}12%,36%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}44%{opacity:1;transform:translate(-50%,-50%) scaleY(.05) scaleX(3)}48%,100%{opacity:0;transform:translate(-50%,-50%) scale(0)}}
@keyframes f2tile{0%,44%{transform:scale(0);opacity:0}52%,90%{transform:none;opacity:1}100%{opacity:0}}
@keyframes f2word{0%,54%{max-width:0;margin-left:0;opacity:1}66%,90%{max-width:6em;margin-left:.35em;opacity:1}100%{max-width:6em;margin-left:.35em;opacity:0}}

/* F3 Letter Drop */
.f3 .w{position:relative}
.f3 .l{animation:f3drop 5.5s cubic-bezier(.3,1.5,.5,1) infinite backwards;animation-delay:calc(var(--i) * 70ms)}
.f3 .tile{animation:f3tile 5.5s cubic-bezier(.2,1.2,.4,1) infinite}
.ul{position:absolute;left:0;right:0;bottom:-.2em;height:.09em;border-radius:1em;background:var(--amber);transform-origin:left;animation:f3ul 5.5s cubic-bezier(.7,0,.2,1) infinite}
@keyframes f3drop{0%,4%{opacity:0;transform:translateY(-2.2em) rotate(-8deg)}16%,86%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateY(.5em)}}
@keyframes f3tile{0%,22%{opacity:0;transform:translateX(-4em) rotate(-360deg)}34%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes f3ul{0%,34%{transform:scaleX(0);opacity:1}46%,86%{transform:scaleX(1);opacity:1}94%,100%{transform:scaleX(1);opacity:0}}

/* F4 Amber Wipe */
.f4 .fa{position:absolute;inset:0;animation:f4a 5s steps(1,end) infinite}
.f4 .fb{position:absolute;inset:0;animation:f4b 5s steps(1,end) infinite}
.panel{position:absolute;top:-10%;bottom:-10%;left:-25%;width:150%;z-index:3;background:var(--amber);animation:f4panel 5s cubic-bezier(.75,0,.25,1) infinite}
.f4 .lock{font-size:2.6em;animation:f4lock 5s cubic-bezier(.2,.9,.3,1) infinite}
.f4 .c{color:var(--ink)}.f4 .n{color:#fff}
.f4 .tile rect{fill:var(--ink)}.f4 .tile g{stroke:var(--amber)}
@keyframes f4a{0%{opacity:1}14%,100%{opacity:0}}
@keyframes f4b{0%,74%{opacity:0}74.01%,100%{opacity:1}}
@keyframes f4panel{0%{transform:translateX(-110%) skewX(-14deg)}14%,74%{transform:translateX(0) skewX(-14deg)}90%,100%{transform:translateX(110%) skewX(-14deg)}}
@keyframes f4lock{0%,12%{opacity:0;transform:scale(.7);filter:blur(.15em)}24%,72%{opacity:1;transform:none;filter:blur(0)}80%,100%{opacity:0;transform:translateX(1.5em);filter:blur(0)}}

/* F5 Scissor Split */
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;z-index:5}
.half.t{top:0;animation:f5t 6s cubic-bezier(.7,0,.2,1) infinite}
.half.b{bottom:0;animation:f5b 6s cubic-bezier(.7,0,.2,1) infinite}
.ff{position:absolute;left:0;right:0;height:200%}
.half.t .ff{top:0}.half.b .ff{bottom:0}
.cl{position:absolute;left:0;right:0;top:50%;height:.14em;margin-top:-.07em;z-index:6;background:var(--amber);box-shadow:0 0 .8em var(--amber);transform-origin:left;animation:f5cl 6s cubic-bezier(.7,0,.3,1) infinite}
.f5 .lock{animation:f5lock 6s ease infinite}
@keyframes f5t{0%,24%{transform:none}36%,74%{transform:translateY(-102%)}86%,100%{transform:none}}
@keyframes f5b{0%,24%{transform:none}36%,74%{transform:translateY(102%)}86%,100%{transform:none}}
@keyframes f5cl{0%,8%{transform:scaleX(0);opacity:1}20%{transform:scaleX(1);opacity:1}28%,100%{transform:scaleX(1);opacity:0}}
@keyframes f5lock{0%,26%{opacity:0;transform:scale(.8)}38%,72%{opacity:1;transform:none}78%,100%{opacity:0;transform:scale(.95)}}

/* F6 End Card */
.f6 .blur{position:absolute;inset:0;animation:f6blur 6s ease infinite}
.made{font:700 .8em "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);animation:f6a 6s ease infinite}
.f6 .lock{animation:f6b 6s cubic-bezier(.2,.9,.3,1) infinite}
.f6 .tag{color:#fff;background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.5);border-radius:99em;padding:.45em 1em;animation:f6c 6s ease infinite}
@keyframes f6blur{0%,6%{filter:blur(0) brightness(1)}20%,90%{filter:blur(.8em) brightness(.35)}100%{filter:blur(0) brightness(1)}}
@keyframes f6a{0%,14%{opacity:0;transform:translateY(.5em)}22%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes f6b{0%,18%{opacity:0;transform:translateY(.4em) scale(.96)}30%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes f6c{0%,28%{opacity:0;transform:translateY(.3em)}38%,88%{opacity:1;transform:none}96%,100%{opacity:0}}

#stage{width:360px}
#stage .stage{border-radius:0}
</style>
<div id="stage"></div>
<script>
const STAR = 'M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z';
const tile = () => `<svg class="tile" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#f59e0b"/><g transform="translate(6 6) scale(0.8333)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="star" pathLength="1" d="${STAR}"/><path class="x1" d="M20 3v4"/><path class="x1" d="M22 5h-4"/><path class="x2" d="M4 17v2"/><path class="x2" d="M5 18H3"/></g></svg>`;
const letters = (s, cls, start) => [...s].map((ch, i) => `<span class="l ${cls}" style="--i:${start + i}">${ch}</span>`).join('');
const word = ({ split = false, mid = '', extra = '' } = {}) => split
  ? `<span class="w">${letters('clip', 'c', 0)}${mid}${letters('nera', 'n', 4)}${extra}</span>`
  : `<span class="w"><span class="c">clip</span>${mid}<span class="n">nera</span>${extra}</span>`;
const footage = h => `<div class="footage" style="--h:${h}"></div><div class="subj" style="--h:${h}"></div>`;
const cap = '<div class="cap">and that\'s when it <em>clicked</em></div>';
const lock = (opts, cls = '') => `<div class="mark lock ${cls}">${tile()}${word(opts)}</div>`;

const WATERMARKS = [
  { id: 'W1', name: 'Sparkle Twinkle', loop: '4 s loop', h: 210, note: 'The name stays still; the sparkle spins and flashes every 4 seconds. Quiet, and it reads as the brand.', mark: `<div class="mark wm m-twinkle">${tile()}${word()}</div>` },
  { id: 'W2', name: 'Sheen Sweep', loop: '4.5 s loop', h: 330, note: 'Today\'s dark pill with a light sweep across it. Closest to what ships now.', mark: `<div class="mark wm pill m-sheen">${tile()}${word()}</div>` },
  { id: 'W3', name: 'Letter Rise', loop: '6 s loop', h: 150, note: 'The tile pops in, the letters rise one at a time, hold, then clear and start again.', mark: `<div class="mark wm m-rise">${tile()}${word({ split: true })}</div>` },
  { id: 'W4', name: 'Corner Hop', loop: '3 s per corner', h: 20, note: 'Moves corner to corner every 3 seconds. The hardest one to crop or blur out.', mark: `<div class="mark wm m-hop">${tile()}${word()}</div>` },
  { id: 'W5', name: 'Unfold', loop: '7 s loop', h: 260, note: 'The tile spins and the name slides out from behind it, holds, then folds back in.', mark: `<div class="mark wm m-unfold">${tile()}${word()}</div>` },
  { id: 'W6', name: 'Clip Cut', loop: '5 s loop', h: 190, note: 'A cut line splits "clip" from "nera" and they snap back together. Plays on what Clipnera does.', mark: `<div class="mark wm m-cut">${tile()}${word({ mid: '<span class="cutline"></span>' })}</div>` },
  { id: 'W7', name: 'Playhead', loop: 'follows clip length', h: 280, note: 'An amber bar under the name fills as the clip plays, like an editor timeline.', mark: `<div class="mark wm m-play"><div class="row">${tile()}${word()}</div><div class="bar"></div></div>` },
  { id: 'W8', name: 'Breathe', loop: '8 s loop', h: 100, note: 'Fades slowly between 35% and 85% visible. The least distracting for viewers.', mark: `<div class="mark wm m-breathe">${tile()}${word()}</div>` },
];

const rays = Array.from({ length: 8 }, (_, i) => `<span class="ray" style="--r:${i * 45}deg"></span>`).join('');
const frames = [18, 200, 330, 150, 40, 260, 190, 300, 90, 350].map((h, i) => `<span class="fr" style="--h:${h};--i:${i}"></span>`).join('');

const FULL = [
  { id: 'F1', name: 'Sparkle Ignite', loop: 'Intro · 2.5 s', note: 'The tile spins in, the sparkle draws itself and bursts, then the name wipes out from behind it.',
    stage: `<div class="fs f1"><div class="center"><div class="mark lock"><span class="tw">${tile()}${rays}</span>${word()}</div><div class="tag">Long videos in. Clips out.</div></div></div>` },
  { id: 'F2', name: 'Timeline Cut', loop: 'Intro · 3 s', note: 'Clip frames slide past a playhead, the playhead cuts, and everything collapses into the logo.',
    stage: `<div class="fs f2"><div class="strip">${frames}</div><div class="ph"></div><div class="center">${lock()}</div></div>` },
  { id: 'F3', name: 'Letter Drop', loop: 'Intro or outro · 2.5 s', note: 'The letters drop in with a bounce, the tile rolls in beside them, and an amber underline draws.',
    stage: `<div class="fs f3"><div class="center">${lock({ split: true, extra: '<span class="ul"></span>' })}</div></div>` },
  { id: 'F4', name: 'Amber Wipe', loop: 'Transition · 2 s', note: 'An amber wipe carries the logo across, then clears to the next clip. Made for the cut between two clips in a reel.',
    stage: `<div class="fs f4"><div class="fa">${footage(20)}</div><div class="fb">${footage(200)}</div><div class="panel"></div><div class="center">${lock()}</div></div>` },
  { id: 'F5', name: 'Scissor Split', loop: 'Transition · 3 s', note: 'An amber line slices the frame, the halves part to show the logo, then close again.',
    stage: `<div class="fs f5"><div class="center">${lock()}</div><div class="half t"><div class="ff">${footage(300)}</div></div><div class="half b"><div class="ff">${footage(300)}</div></div><div class="cl"></div></div>` },
  { id: 'F6', name: 'End Card', loop: 'Outro · 3 s', note: 'The last frame blurs and darkens, then "made with clipnera" settles in. Suited to Free-plan exports.',
    stage: `<div class="fs f6"><div class="blur">${footage(170)}</div><div class="center"><div class="made">Made with</div>${lock()}<div class="tag">Turn long videos into shorts</div></div></div>` },
];
const PIECES = Object.fromEntries([...WATERMARKS, ...FULL].map(p => [p.id, p]));
const FACES = ['800 40px Syne', '700 40px Syne', '600 20px "Plus Jakarta Sans"', '500 20px "JetBrains Mono"'];
Promise.all(FACES.map(f => document.fonts.load(f))).then(found => {
  const missing = FACES.filter((_, i) => !found[i].length);
  if (missing.length) window.harnessError = `Fonts not loaded: ${missing.join(', ')}`;
  else window.harnessReady = true;
});
window.Reel = {
  /** Show one piece; watermarks sit on the sample clip like on the review page. */
  mount(id) {
    const p = PIECES[id];
    document.getElementById('stage').innerHTML = `<div class="stage">${p.mark ? footage(p.h) + cap + p.mark : p.stage}</div>`;
  },
  /** Freeze every animation at ``t`` seconds and wait for it to paint. */
  seek(t) {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
    return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  },
};
</script>
